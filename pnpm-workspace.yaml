packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # next bundles its own older postcss internally for its build pipeline
  # (GHSA-qx2v-qp2m-jg93 — XSS via unescaped </style> when re-stringifying
  # untrusted CSS, which this app never does at runtime). Force the whole
  # tree onto the patched line regardless.
  postcss: '^8.5.18'
  # Transitive-only dependencies (tooling: eslint/minimatch, fastify's
  # router/schema validation) with disclosed advisories and no direct
  # control over the version — pin to the patched line via override.
  brace-expansion: '^5.0.8'
  fast-uri: '^3.1.4'
  find-my-way: '^9.7.0'
  # ^4.3.0 still permitted 4.3.0 itself (the vulnerable version, GHSA-5p4m-
  # 2wfm-xmqj) — the caret range only excludes 5.x, not the floor.
  js-yaml: '^4.3.1'
  nanoid: '^3.3.17'
  sharp: '^0.35.0'
