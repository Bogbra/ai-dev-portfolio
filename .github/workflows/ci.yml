name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck
        run: pnpm lint
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_AI_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_AI_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Test
        run: pnpm test

  e2e:
    name: E2E & accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install uv (apps/ai backend needed by the MCP Lab e2e test)
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install apps/ai dependencies
        working-directory: apps/ai
        run: uv sync --frozen

      # No API keys set — runs in mock mode, same as every other workflow
      # without OPENAI_API_KEY. e2e/mcp-lab.spec.ts needs a real /mcp
      # endpoint to talk to (it drives the MCP Lab's actual browser
      # fetch() calls, not a mock), so this starts the real backend rather
      # than stubbing it.
      - name: Start apps/ai backend (mock mode)
        working-directory: apps/ai
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 4000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 1
          done
          echo "apps/ai did not become healthy in time" >&2
          exit 1

      - name: Run e2e & accessibility tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_AI_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  ai-quality:
    name: Python lint & test (apps/ai)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies (including dev)
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest --tb=short

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Direct action, not google/osv-scanner-action's reusable workflow: the
      # reusable workflow's own top-level `permissions:` unconditionally
      # requests security-events:write (for SARIF upload to Code Scanning,
      # which we don't use), and this repo's default workflow token
      # permissions are read-only — that combination fails at workflow
      # resolution time with "startup_failure", before any job even starts,
      # regardless of what this caller requests. The plain scanner action
      # needs no elevated permissions and exits non-zero on a found
      # vulnerability, which fails this step/job the same way.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -L pnpm-lock.yaml
            -L apps/ai/uv.lock

  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, ai]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — no registry push. Proves the Dockerfiles the README
      # documents as the deployment path actually build, since none of the
      # other jobs exercise them.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
