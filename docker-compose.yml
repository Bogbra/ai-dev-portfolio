name: ai-systems-showcase

# ─────────────────────────────────────────────────────────────────────────────
# Quick start (mock mode — no API keys required):
#   docker compose up --build
#
# Live mode (real OpenAI / Tavily / Resend):
#   Copy .env.example to .env, fill in secrets, then:
#   docker compose up --build
#
# See README → Docker for full instructions.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Next.js frontend ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # These must point to browser-accessible URLs (localhost for local Docker).
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_AI_URL: http://localhost:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ── Fastify contact backend ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Allow requests from the browser (host-side localhost).
      ALLOWED_ORIGINS: "http://localhost:3000"
      # Contact form defaults — safe to leave as-is for local demo. Interpolated
      # (not hardcoded) so a value set in .env actually takes effect: Compose
      # applies `environment:` after `env_file:`, so a bare "false" here would
      # silently override ENABLE_EMAIL_SENDING=true from .env regardless of
      # what the file says.
      ENABLE_EMAIL_SENDING: "${ENABLE_EMAIL_SENDING:-false}"
      MAIL_FROM: "${MAIL_FROM:-portfolio@example.com}"
      MAIL_TO: "${MAIL_TO:-owner@example.com}"
      # RESEND_API_KEY — set in .env to enable live email sending.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:3001/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ── FastAPI AI backend ─────────────────────────────────────────────────────
  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      # OPENAI_API_KEY / TAVILY_API_KEY / VOICE_OPENAI_API_KEY — set in .env.
      # Without OPENAI_API_KEY, CS01-CS03 and SEO fall back to deterministic
      # mock mode automatically; the Voice Agent Lab has no mock mode and is
      # disabled without usable speech credentials.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health').read()"
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 128M
